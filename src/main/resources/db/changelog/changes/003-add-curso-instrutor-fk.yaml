databaseChangeLog:
  - changeSet:
      id: 003-add-curso-instrutor-fk
      author: hiago
      changes:
        - addForeignKeyConstraint:
            baseTableName: curso
            baseColumnNames: instrutor_id
            referencedTableName: instrutor
            referencedColumnNames: id
            constraintName: fk_curso_instrutor
            onDelete: RESTRICT
        - createIndex:
            tableName: curso
            indexName: idx_curso_instrutor_id
            columns:
              - column:
                  name: instrutor_id
      rollback:
        - dropForeignKeyConstraint:
            baseTableName: curso
            constraintName: fk_curso_instrutor
        - dropIndex:
            tableName: curso
            indexName: idx_curso_instrutor_id
